name: Fragility Benchmark

# Weekly mutation-testing of every recorded agent in the repo, published as a
# fragility leaderboard. Runs entirely in replay mode against committed
# cassettes — no API keys, no live LLM calls.
#
# To put a real agent on the board, commit its recorded session (and the agent
# it re-runs) so the driver can exercise it; sessions without a runnable
# command are skipped automatically.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fragility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rewind
        run: pip install -e .

      - name: Generate local CA
        run: rewind init

      - name: Run fragility benchmark
        run: python scripts/run_fragility_benchmark.py --output-dir benchmark_site

      - name: Upload leaderboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: fragility-leaderboard
          path: benchmark_site/

      # Deploy to GitHub Pages. Requires Pages enabled for the repo
      # (Settings -> Pages -> Source: GitHub Actions). Until then the artifact
      # above is the deliverable; the deploy steps are a no-op-safe upgrade.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: benchmark_site/
        continue-on-error: true

  deploy-pages:
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

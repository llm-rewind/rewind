[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rewind-ai"
version = "0.1.0"
description = "Time-travel debugger for AI agents. Record any production run, replay any failure."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["llm", "ai-agents", "debugging", "observability", "replay", "mitmproxy", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mitmproxy>=11.0",
    "duckdb>=1.2",
    "zstandard>=0.23",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "cryptography>=42.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.11",
    "httpx>=0.27",
]

[project.scripts]
rewind = "rewind.cli:cli"

[project.urls]
Homepage = "https://github.com/rewind-ai/rewind"
Repository = "https://github.com/rewind-ai/rewind"
"Bug Tracker" = "https://github.com/rewind-ai/rewind/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rewind"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure logic tests, no I/O, no network",
    "integration: cassette-based integration tests",
    "record: tests that record real LLM calls (requires API key)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "A"]
ignore = [
    "A002",  # allow shadowing builtins in function args (e.g. `import`)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "mitmproxy.*"
ignore_errors = true
follow_imports = "silent"
